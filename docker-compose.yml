# TeamBots on a VPS. The app uses the *host's* Tailscale (the node you join
# with an interactive `tailscale up`) to reach the tailnet. There is no
# sidecar: a second tailscaled would be another node, and the official
# Tailscale image exits when TS_AUTHKEY is empty — which does not fit an
# interactive login.
#
# The UI is published on 127.0.0.1 and on the host's Tailscale IPv4, never
# on 0.0.0.0 / the public NIC. network_mode: host is avoided for the same
# reason: uvicorn would then listen on the public address too.
# Sandboxes join the `teambots` Docker network so the app can reach their
# interactive screens. See docs/deploy-vps.md.
#
# The app has no Docker access. Only `sandboxd` mounts the Docker socket; it
# has no network and listens on a Unix socket shared with the app alone. It
# runs sandboxes with TB_SANDBOX_RUNTIME (set `runsc` once gVisor is
# installed on the host, see README "Security").
#
#   cp .env.example .env   # fill TB_SECRET_KEY and TB_TAILSCALE_IP
#   docker compose up -d --build
#
# For a laptop / Docker Desktop, use docker-compose.local.yml
# (./start.sh and .\start.ps1).
services:
  sandbox-image:
    build: ./sandbox
    image: teambots-sandbox:latest
    command: ["true"]
    restart: "no"

  sandboxd:
    build: .
    image: teambots-app:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - rm -f /run/teambots/sandboxd.sock && exec uvicorn app.sandboxd:app --uds /run/teambots/sandboxd.sock
    environment:
      TB_SANDBOX: docker
      TB_SANDBOX_IMAGE: teambots-sandbox:latest
      TB_SANDBOX_NETWORK: teambots
      TB_SANDBOX_RUNTIME: ${TB_SANDBOX_RUNTIME:-}
      TB_SANDBOX_RESOLV_CONF: ${TB_SANDBOX_RESOLV_CONF:-}
      TB_DATA_DIR: /tmp/sandboxd
    volumes:
      - sandboxd-run:/run/teambots
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.Client(transport=httpx.HTTPTransport(uds='/run/teambots/sandboxd.sock'), timeout=5).get('http://s/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    image: teambots-app:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      sandboxd:
        condition: service_healthy
    command:
      - sh
      - -c
      - mkdir -p /data/claude-home /data/claude-cli-cwd && exec uvicorn app.main:app --host 0.0.0.0 --port 18080 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "127.0.0.1:18080:18080"
      - "${TB_TAILSCALE_IP:?set TB_TAILSCALE_IP to the host Tailscale IPv4 (tailscale ip -4)}:18080:18080"
    environment:
      TB_SECRET_KEY: ${TB_SECRET_KEY:?set TB_SECRET_KEY in .env (long random string)}
      TB_TIMEZONE: ${TB_TIMEZONE:-Europe/Amsterdam}
      TB_SANDBOX: docker
      TB_SANDBOX_IMAGE: teambots-sandbox:latest
      TB_SANDBOX_NETWORK: teambots
      TB_SANDBOXD_SOCKET: /run/teambots/sandboxd.sock
      TB_HTTP_ALLOW_PRIVATE: ${TB_HTTP_ALLOW_PRIVATE:-1}
      TB_PUBLIC_URL: ${TB_PUBLIC_URL:-}
      TB_OPEN_REGISTRATION: ${TB_OPEN_REGISTRATION:-0}
      TB_ENABLE_DOCS: ${TB_ENABLE_DOCS:-0}
      TB_AUTH_RATE_LIMIT: ${TB_AUTH_RATE_LIMIT:-10}
      TB_CODING_BOTS: ${TB_CODING_BOTS:-0}
      TB_DATA_DIR: /data
      TB_CLAUDE_CLI: claude
      TB_CLAUDE_CLI_CWD: /data/claude-cli-cwd
      HOME: /data/claude-home
    volumes:
      - ${TB_HOST_DATA:-./data}:/data
      - sandboxd-run:/run/teambots
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [teambots]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

networks:
  teambots:
    name: teambots

volumes:
  sandboxd-run:
