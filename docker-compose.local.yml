# TeamBots on a laptop or a machine without the VPS Tailscale bind.
# Used by ./start.sh and .\start.ps1. The app binds to loopback only
# by default; the optional Caddy profile fronts it with TLS on a server.
#
#   docker compose -f docker-compose.local.yml up -d --build
services:
  sandbox-image:
    build: ./sandbox
    image: teambots-sandbox:latest
    command: ["true"]
    restart: "no"
  # Only sandboxd holds the Docker socket; the app talks to it over a Unix socket. See README, "Security".
  sandboxd:
    build: .
    image: teambots-app:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    command: ["sh", "-c", "rm -f /run/teambots/sandboxd.sock && exec uvicorn app.sandboxd:app --uds /run/teambots/sandboxd.sock"]
    environment:
      TB_SANDBOX: docker
      TB_SANDBOX_RUNTIME: ${TB_SANDBOX_RUNTIME:-}
      TB_SANDBOX_RESOLV_CONF: ${TB_SANDBOX_RESOLV_CONF:-}
      TB_DATA_DIR: /tmp/sandboxd
    volumes:
      - sandboxd-run:/run/teambots
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.Client(transport=httpx.HTTPTransport(uds='/run/teambots/sandboxd.sock'), timeout=5).get('http://s/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  app:
    build: .
    image: teambots-app:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      sandboxd:
        condition: service_healthy
    ports: ["${TB_BIND:-127.0.0.1}:8080:8080"]
    environment:
      TB_SECRET_KEY: ${TB_SECRET_KEY:?set TB_SECRET_KEY in .env (long random string)}
      TB_TIMEZONE: ${TB_TIMEZONE:-Europe/Amsterdam}
      TB_SANDBOX: docker
      TB_SANDBOXD_SOCKET: /run/teambots/sandboxd.sock
      TB_HTTP_ALLOW_PRIVATE: ${TB_HTTP_ALLOW_PRIVATE:-0}
      TB_OPEN_REGISTRATION: ${TB_OPEN_REGISTRATION:-0}
      TB_ENABLE_DOCS: ${TB_ENABLE_DOCS:-0}
      TB_AUTH_RATE_LIMIT: ${TB_AUTH_RATE_LIMIT:-10}
      TB_CODING_BOTS: ${TB_CODING_BOTS:-0}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - tb-data:/data
      - sandboxd-run:/run/teambots
    restart: unless-stopped
  caddy:
    profiles: ["server"]
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${TB_DOMAIN:-localhost} --to app:8080
    volumes: [caddy-data:/data]
    restart: unless-stopped
volumes:
  tb-data:
  caddy-data:
  sandboxd-run:
